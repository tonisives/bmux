name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to build
        required: true
        type: string
      verify_only:
        description: Test macOS packages from the selected workflow ref without publishing
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.verify_only && github.ref || github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.verify_only && github.sha || env.RELEASE_TAG }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --child-concurrency=4
      - run: pnpm check

  build:
    needs: check
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.verify_only && github.sha || env.RELEASE_TAG }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --child-concurrency=4

      - name: Set release version
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH format: $RELEASE_TAG" >&2
            exit 1
          fi
          current="$(node -p "require('./package.json').version")"
          if [ "$current" != "$version" ]; then
            pnpm version --no-git-tag-version "$version"
          fi

      - name: Import Developer ID certificate
        uses: Apple-Actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Build signed and notarized ${{ matrix.arch }} packages
        env:
          BMUX_NATIVE_ARCH: ${{ matrix.arch }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          pnpm build
          test "$(lipo -archs out/native/pointer.node)" = "${{ matrix.arch == 'x64' && 'x86_64' || 'arm64' }}"
          pnpm exec electron-builder --config electron-builder.release.mjs --mac --${{ matrix.arch }} --publish never

      - name: Verify signed and notarized release artifacts
        run: |
          bash scripts/verify-macos-dmg.sh "release/bmux-${RELEASE_TAG#v}-${{ matrix.arch }}.dmg" "${{ matrix.arch }}"
          node scripts/verify-update-metadata.mjs "release/latest-${{ matrix.arch }}-mac.yml" "${RELEASE_TAG#v}" "${{ matrix.arch }}"

      - name: Smoke test the native packaged app
        shell: bash
        run: |
          if [ "$(node -p process.arch)" = "${{ matrix.arch }}" ]; then
            BMUX_APP="$PWD/release/${{ matrix.arch == 'arm64' && 'mac-arm64' || 'mac' }}/bmux.app" node scripts/smoke-packaged.mjs
          fi

      - name: Retain verified macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-*-mac.yml

      - name: Upload macOS packages and update feed
        if: ${{ !inputs.verify_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" release/*.dmg release/*.zip release/*.blockmap --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload "$RELEASE_TAG" "release/latest-${{ matrix.arch }}-mac.yml" --clobber --repo "$GITHUB_REPOSITORY"

  linux:
    if: ${{ !inputs.verify_only }}
    needs: check
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Test Linux host
        run: |
          docker build --target test -t bmux-test:local .
          scripts/test-linux.sh
      - name: Package Linux host
        run: |
          docker build --target packaged -t bmux-package:local .
          container=$(docker create bmux-package:local)
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/opt/bmux/release/bmux-linux-${{ matrix.arch }}.tar.gz" .
          tar -tzf "bmux-linux-${{ matrix.arch }}.tar.gz" >/dev/null
      - name: Upload Linux archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "bmux-linux-${{ matrix.arch }}.tar.gz" --clobber --repo "$GITHUB_REPOSITORY"

  windows:
    if: ${{ !inputs.verify_only }}
    needs: check
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --child-concurrency=4
      - name: Build Windows installer
        run: |
          pnpm build
          pnpm exec electron-builder --win nsis --x64 --publish never
          test -s "release/bmux-${RELEASE_TAG#v}-x64.exe"
      - name: Upload Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "release/bmux-${RELEASE_TAG#v}-x64.exe" --clobber --repo "$GITHUB_REPOSITORY"

  update-homebrew:
    if: ${{ !inputs.verify_only }}
    needs: build
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
    steps:
      - name: Download exact release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir release-assets
          version="${RELEASE_TAG#v}"
          for name in bmux-${version}-arm64.dmg bmux-${version}-x64.dmg; do
            gh release download "$RELEASE_TAG" --pattern "$name" --dir release-assets --repo "$GITHUB_REPOSITORY"
            test -s "release-assets/$name"
            case "$name" in
              *.dmg) hdiutil verify "release-assets/$name" ;;
              *.tar.gz) tar -tzf "release-assets/$name" >/dev/null ;;
            esac
          done

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: tonisives/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update tap from verified assets
        run: |
          python3 homebrew-tap/scripts/update_release.py \
            --product bmux --tag "$RELEASE_TAG" \
            --assets release-assets --tap homebrew-tap

      - name: Verify Homebrew entries before publishing
        run: |
          set -euo pipefail
          brew tap tonisives/tap
          if brew help trust >/dev/null 2>&1; then brew trust --tap tonisives/tap; fi
          tap_dir="$(brew --repository tonisives/tap)"
          cp homebrew-tap/Casks/bmux.rb "$tap_dir/Casks/bmux.rb"
          brew style homebrew-tap/Casks/bmux.rb
          brew audit --cask --strict tonisives/tap/bmux
          brew fetch --cask tonisives/tap/bmux

      - name: Commit and push
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/bmux.rb
          git diff --staged --quiet || git commit -m "Update bmux to $RELEASE_TAG"
          git push
