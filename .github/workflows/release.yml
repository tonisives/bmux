name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to build
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --child-concurrency=4
      - run: pnpm check

  build:
    needs: check
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --child-concurrency=4

      - name: Set release version
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH format: $RELEASE_TAG" >&2
            exit 1
          fi
          current="$(node -p "require('./package.json').version")"
          if [ "$current" != "$version" ]; then
            pnpm version --no-git-tag-version "$version"
          fi

      - name: Build ${{ matrix.arch }} DMG
        env:
          BMUX_NATIVE_ARCH: ${{ matrix.arch }}
        run: |
          pnpm build
          test "$(lipo -archs out/native/pointer.node)" = "${{ matrix.arch == 'x64' && 'x86_64' || 'arm64' }}"
          pnpm exec electron-builder --mac dmg --${{ matrix.arch }} --publish never

      - name: Verify package architecture
        shell: bash
        run: |
          app="release/${{ matrix.arch == 'arm64' && 'mac-arm64' || 'mac' }}/bmux.app"
          test -d "$app"
          lipo "$app/Contents/MacOS/bmux" -verify_arch "${{ matrix.arch == 'x64' && 'x86_64' || 'arm64' }}"
          lipo "$app/Contents/Resources/app.asar.unpacked/out/native/pointer.node" -verify_arch "${{ matrix.arch == 'x64' && 'x86_64' || 'arm64' }}"

      - name: Upload DMG to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          artifact="release/bmux-${RELEASE_TAG#v}-${{ matrix.arch }}.dmg"
          test -f "$artifact"
          gh release upload "$RELEASE_TAG" "$artifact" --clobber --repo "$GITHUB_REPOSITORY"

  update-homebrew:
    needs: build
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
    steps:
      - name: Download exact release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir release-assets
          version="${RELEASE_TAG#v}"
          for name in bmux-${version}-arm64.dmg bmux-${version}-x64.dmg; do
            gh release download "$RELEASE_TAG" --pattern "$name" --dir release-assets --repo "$GITHUB_REPOSITORY"
            test -s "release-assets/$name"
            case "$name" in
              *.dmg) hdiutil verify "release-assets/$name" ;;
              *.tar.gz) tar -tzf "release-assets/$name" >/dev/null ;;
            esac
          done

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: tonisives/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update tap from verified assets
        run: |
          python3 homebrew-tap/scripts/update_release.py \
            --product bmux --tag "$RELEASE_TAG" \
            --assets release-assets --tap homebrew-tap

      - name: Verify Homebrew entries before publishing
        run: |
          set -euo pipefail
          brew tap tonisives/tap
          if brew help trust >/dev/null 2>&1; then brew trust --tap tonisives/tap; fi
          tap_dir="$(brew --repository tonisives/tap)"
          cp homebrew-tap/Casks/bmux.rb "$tap_dir/Casks/bmux.rb"
          brew style homebrew-tap/Casks/bmux.rb
          brew audit --cask --strict tonisives/tap/bmux
          brew fetch --cask tonisives/tap/bmux

      - name: Commit and push
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/bmux.rb
          git diff --staged --quiet || git commit -m "Update bmux to $RELEASE_TAG"
          git push
