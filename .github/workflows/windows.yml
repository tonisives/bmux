name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --child-concurrency=4
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Build Windows installer
        run: |
          pnpm build
          pnpm exec electron-builder --win nsis --x64 --publish never -c.nsis.runAfterFinish=false
      - name: Install to a disposable directory
        shell: pwsh
        run: ./scripts/install-windows-test.ps1 -Installer (Get-ChildItem release/bmux-*-x64.exe).FullName
      - run: pnpm test:windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-results
          path: |
            test-results/
            release/bmux-*-x64.exe
          if-no-files-found: ignore
