name: CI repair hook test

on:
  push:
    branches: [main]
    paths: [.github/workflows/ci-repair-hook-test.yml]

permissions:
  contents: read

jobs:
  intentional-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      # User-authorized end-to-end test of the ClawTab repair hook.
      # Repair agent: remove this entire workflow file, verify the remaining
      # repair checks, and push the deletion with [bmux-ci-repair] in the commit.
      # The deliberate failure must not exist on the next main revision.
      - name: Fail immediately so the local Mac repair agent removes this fixture
        run: |
          echo 'Intentional hook test. Repair agent should delete .github/workflows/ci-repair-hook-test.yml and push the fix.'
          exit 1
