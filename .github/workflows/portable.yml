name: Portable hosts
on:
  push:
    branches: [main, feat/portable-bmux]
  pull_request:
  workflow_dispatch:
    inputs:
      test_pattern:
        description: Run matching Linux Electron tests; leave empty for the full suite
        required: false
        type: string
      native_crashes:
        description: Collect native crash stacks in the disposable Linux runner
        required: false
        default: false
        type: boolean
      repeat_each:
        description: Repeat each Linux test (1-32)
        required: false
        default: 1
        type: number
      shared_memory:
        description: Shared memory limit for the disposable Linux browser
        required: false
        default: 1g
        type: choice
        options: [1g, 256m]
      window_manager:
        description: Window manager for focused hidden-capture tests
        required: false
        default: openbox
        type: choice
        options: [openbox, none]
      memory_limit:
        description: Memory limit for the disposable Linux browser
        required: false
        default: unlimited
        type: choice
        options: [unlimited, 2g]
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target test -t bmux-test:local .
      - name: Enable native crash diagnostics
        if: inputs.native_crashes
        run: sudo sysctl -w kernel.core_pattern=/tmp/bmux-core.%p
      - name: Linux tests
        env:
          TEST_PATTERN: ${{ inputs.test_pattern }}
          REPEAT_EACH: ${{ inputs.repeat_each || 1 }}
          BMUX_NATIVE_CRASH_DIAGNOSTICS: ${{ inputs.native_crashes && '1' || '0' }}
          BMUX_TEST_SHM_SIZE: ${{ inputs.shared_memory || '1g' }}
          BMUX_TEST_WINDOW_MANAGER: ${{ inputs.window_manager || 'openbox' }}
          BMUX_TEST_MEMORY_LIMIT: ${{ inputs.memory_limit == '2g' && '2g' || '0' }}
        run: |
          case "$REPEAT_EACH" in
            [1-9]|[12][0-9]|3[0-2]) ;;
            *) echo "repeat_each must be between 1 and 32"; exit 1 ;;
          esac
          if [ -n "$TEST_PATTERN" ]; then
            scripts/test-linux.sh --grep "$TEST_PATTERN" --repeat-each "$REPEAT_EACH"
          else
            scripts/test-linux.sh --repeat-each "$REPEAT_EACH"
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: linux-test-results-${{ matrix.arch }}
          path: test-results/
          if-no-files-found: ignore
      - run: docker build --target host -t bmux-host:local .
      - run: docker build --target service -t bmux-remote:local .
      - name: Start the packaged connection service
        run: |
          docker run --rm \
            -e DATABASE_URL=postgres://fixture@127.0.0.1:1/fixture \
            -e BMUX_PUBLIC_ORIGIN=http://127.0.0.1:8788 \
            -e BMUX_GOOGLE_CLIENT_ID=fixture \
            -e BMUX_TURN_SECRET=fixture \
            -e BMUX_TURN_URLS=turn:127.0.0.1:3478 \
            bmux-remote:local node --input-type=module -e '
              await import("./remote/server.mjs")
              let response = await fetch("http://127.0.0.1:8788/health")
              if (response.status !== 503) throw new Error("Expected database-wait readiness")
              process.kill(process.pid, "SIGTERM")
            '
      - run: docker build --target packaged -t bmux-package:local .
      - run: |
          docker create --name package bmux-package:local
          docker cp package:/opt/bmux/release/bmux-linux-${{ matrix.arch }}.tar.gz .
          docker rm package
      - uses: actions/upload-artifact@v4
        with:
          name: bmux-linux-${{ matrix.arch }}
          path: bmux-linux-${{ matrix.arch }}.tar.gz
