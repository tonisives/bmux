name: Remote app
on:
  push:
    branches: [main, feat/remote-app]
    paths: ['remote-app/**', 'remote/web/client.ts', 'remote/web/viewer-updates.ts', 'src/shared/remote*.ts', 'tests/remote-app.electron.test.ts', '.github/workflows/remote-app.yml']
  pull_request:
    paths: ['remote-app/**', 'remote/web/client.ts', 'remote/web/viewer-updates.ts', 'src/shared/remote*.ts', 'tests/remote-app.electron.test.ts', '.github/workflows/remote-app.yml']
  workflow_dispatch:
    inputs:
      retained_app_run:
        description: 'Verify the chooser using a compatible compiled Debug app from this run'
        type: string
        default: ''
concurrency:
  group: ${{ inputs.retained_app_run != '' && 'remote-chooser-dispatch' || 'remote-app' }}-${{ github.ref }}
  cancel-in-progress: ${{ !inputs.retained_app_run }}
jobs:
  web:
    if: ${{ !inputs.retained_app_run }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: remote-app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: remote-app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --child-concurrency=4
      - run: pnpm check
      - run: pnpm export:web
      - uses: actions/upload-artifact@v4
        with:
          name: remote-app-web
          path: remote-app/dist/
          include-hidden-files: true
  browser:
    needs: web
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --child-concurrency=4
      - uses: actions/download-artifact@v4
        with:
          name: remote-app-web
          path: remote-app/dist/
      - run: pnpm test:electron tests/remote-app.electron.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remote-app-browser-results
          path: test-results/
  android:
    if: ${{ !inputs.retained_app_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: remote-app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: remote-app/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile --child-concurrency=4
      - run: pnpm exec expo prebuild --platform android --no-install
      - run: ./gradlew :app:assembleRelease --no-daemon --max-workers=4 -PreactNativeArchitectures=arm64-v8a
        working-directory: remote-app/android
      - uses: actions/upload-artifact@v4
        with:
          name: remote-app-android-preview
          path: remote-app/android/app/build/outputs/apk/release/*.apk
  ios:
    if: ${{ !inputs.retained_app_run }}
    runs-on: xcode-27
    timeout-minutes: ${{ matrix.configuration == 'Release' && 60 || 50 }}
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release, Debug]
    env:
      BMUX_IOS_BUILD_CONFIGURATION: ${{ matrix.configuration }}
    defaults:
      run:
        working-directory: remote-app
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: remote-app/pnpm-lock.yaml
      - name: Prewarm iOS 27 simulator
        run: node scripts/ios-launch-smoke.mjs prepare
      - run: pnpm install --frozen-lockfile --child-concurrency=4
      - run: pnpm exec expo prebuild --clean --platform ios --no-install
      - run: pnpm verify:ios
      - name: Prepare native launcher tests with CocoaPods Ruby
        if: matrix.configuration == 'Debug'
        shell: bash
        run: ruby scripts/add-ios-launcher-tests.rb 2>&1 | tee ios-smoke/launcher-prepare.log
      - run: pod install --project-directory=ios
      - id: ios-build
        run: xcodebuild -workspace ios/bmuxremote.xcworkspace -scheme bmuxremote -configuration ${{ matrix.configuration }} -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/build -jobs 4 CODE_SIGNING_ALLOWED=NO -quiet build > ios-build.log 2>&1
      - run: pnpm smoke:ios
      - run: pnpm smoke:ios:launcher
        if: matrix.configuration == 'Debug'
      - name: Clean up iOS simulator
        if: always()
        run: node scripts/ios-launch-smoke.mjs cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.configuration == 'Debug' && 'remote-app-ios-dev-launcher' || 'remote-app-ios-launch' }}
          path: remote-app/ios-smoke/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: remote-app-ios-${{ matrix.configuration }}-build-log
          path: remote-app/ios-build.log
      - uses: actions/upload-artifact@v4
        if: always() && steps.ios-build.outcome == 'success'
        with:
          name: ${{ matrix.configuration == 'Debug' && 'remote-app-ios-development-simulator' || 'remote-app-ios-simulator' }}
          path: remote-app/ios/build/Build/Products/${{ matrix.configuration }}-iphonesimulator/*.app/
  chooser:
    if: ${{ inputs.retained_app_run != '' }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/remote-chooser.yml
    with:
      source_run: ${{ inputs.retained_app_run }}
