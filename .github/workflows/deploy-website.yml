name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - website/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/deploy-website.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --child-concurrency=4
      - run: pnpm check
      - run: pnpm site:build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: registry.tonisives.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: website
          file: website/Dockerfile
          platforms: linux/amd64
          push: true
          tags: registry.tonisives.com/bmux-website:site-${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Pin the image for Argo CD
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          digest = os.environ['IMAGE_DIGEST']
          if not re.fullmatch(r'sha256:[a-f0-9]{64}', digest):
              raise SystemExit('Invalid image digest')
          path = pathlib.Path('deploy/k3s/kustomization.yaml')
          source = path.read_text()
          updated, count = re.subn(r'    (?:newTag|digest): .*', '    digest: ' + digest, source)
          if count != 1:
              raise SystemExit('Expected exactly one website image')
          path.write_text(updated)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/k3s/kustomization.yaml
          git diff --cached --quiet && exit 0
          git commit -m 'Deploy website image from GitHub Actions'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
