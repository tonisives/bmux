name: Publish portable host services

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: host
            image: bmux-host
          - target: service
            image: bmux-remote
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: registry.tonisives.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            registry.tonisives.com/${{ matrix.image }}:pilot
            registry.tonisives.com/${{ matrix.image }}:${{ github.sha }}
