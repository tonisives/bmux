name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      test_pattern:
        description: Run matching Electron tests; leave empty for the full suite
        required: false
        type: string
      repeat_each:
        description: Repeat each matching test (1-32); use with test_pattern
        required: false
        default: 1
        type: number
      trace:
        description: Capture profile test traces to investigate input or timing failures
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --child-concurrency=4
      - run: pnpm check
      - name: Keep crash dialogs from obscuring later GUI tests
        run: defaults write com.apple.CrashReporter DialogType none
      - name: Electron tests
        # Keep a bounded suite budget separate from individual test deadlines.
        # The full suite includes real idle-unload waits and runs serially.
        timeout-minutes: 20
        env:
          TEST_PATTERN: ${{ inputs.test_pattern }}
          REPEAT_EACH: ${{ inputs.repeat_each || 1 }}
          BMUX_TEST_TRACE: ${{ inputs.trace && '1' || '0' }}
        run: |
          if [ -n "$TEST_PATTERN" ]; then
            case "$REPEAT_EACH" in
              [1-9]|[12][0-9]|3[0-2]) ;;
              *) echo "repeat_each must be between 1 and 32"; exit 1 ;;
            esac
            pnpm test:electron --grep "$TEST_PATTERN" --repeat-each "$REPEAT_EACH"
          else
            pnpm test:electron
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: electron-test-results
          path: |
            test-results/
            ~/Library/Logs/DiagnosticReports/
          if-no-files-found: ignore
