name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      test_pattern:
        description: Run matching Electron tests; leave empty for the full suite
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --child-concurrency=4
      - run: pnpm check
      - name: Electron tests
        env:
          TEST_PATTERN: ${{ inputs.test_pattern }}
        run: |
          if [ -n "$TEST_PATTERN" ]; then
            pnpm test:electron --grep "$TEST_PATTERN"
          else
            pnpm test:electron
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: electron-test-results
          path: test-results/
          if-no-files-found: ignore
