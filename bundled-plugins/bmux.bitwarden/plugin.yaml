schema_version: 1
id: bmux.bitwarden
name: Bitwarden CLI
version: 1.1.0
actions:
  - id: fill
    title: Fill a Bitwarden login
    description: Run bw login once in a terminal. Unlock once in bmux, choose a login, and click Next for automatic password filling. Only exact origins match.
    command: [node, ./run.mjs]
    capabilities: [browser.write, ui]
    timeout_seconds: 180
