<svg xmlns="http://www.w3.org/2000/svg" width="800" height="572" viewBox="0 0 800 572" role="img" aria-labelledby="title description">
  <title id="title">Sessions, windows, panes, and profiles</title>
  <desc id="description">Two desktop clients attach to the project session and select different internal windows. The research window contains panes 1 and 2 using the work profile. The agents window contains pane 3 using bot and pane 4 using work. All work panes share logins; bot has separate storage.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#63746a"/></marker>
    <style>
      text { font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#304a41; }
      .heading { font-size:28px; font-weight:650; }
      .label { font-size:23px; font-weight:600; }
      .note { font-size:19px; }
      .pane { fill:#fffefa; stroke:#aebfae; stroke-width:1.5; }
      .work { fill:#e4edd9; }
      .bot { fill:#f8dfcf; }
      .profile { font-size:18px; font-weight:600; text-anchor:middle; }
    </style>
  </defs>
  <rect width="800" height="572" fill="#fbfaf6"/>
  <text x="30" y="43" class="heading">One session, several views</text>
  <rect x="54" y="80" width="328" height="100" rx="8" fill="#fffefa" stroke="#aebfae" stroke-width="1.5"/>
  <text x="80" y="117" class="label">Client A</text>
  <text x="80" y="149" class="note">Desktop window</text>
  <rect x="418" y="80" width="328" height="100" rx="8" fill="#fffefa" stroke="#aebfae" stroke-width="1.5"/>
  <text x="444" y="117" class="label">Client B</text>
  <text x="444" y="149" class="note">Desktop window</text>
  <rect x="30" y="218" width="740" height="276" rx="10" fill="#eef1e7" stroke="#aebfae" stroke-width="1.5"/>
  <text x="400" y="254" class="label" text-anchor="middle">Session: project</text>
  <path d="M218 180V278" stroke="#63746a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M582 180V278" stroke="#63746a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="54" y="290" width="328" height="180" rx="6" fill="#fbfaf6" stroke="#aebfae" stroke-width="1.5"/>
  <text x="72" y="324" class="label">Window: research</text>
  <rect x="70" y="342" width="140" height="110" rx="4" class="pane"/>
  <text x="86" y="375" class="note">Pane %1</text>
  <rect x="84" y="399" width="112" height="34" rx="4" class="work"/>
  <text x="140" y="423" class="profile">work</text>
  <rect x="226" y="342" width="140" height="110" rx="4" class="pane"/>
  <text x="242" y="375" class="note">Pane %2</text>
  <rect x="240" y="399" width="112" height="34" rx="4" class="work"/>
  <text x="296" y="423" class="profile">work</text>
  <rect x="418" y="290" width="328" height="180" rx="6" fill="#fbfaf6" stroke="#aebfae" stroke-width="1.5"/>
  <text x="436" y="324" class="label">Window: agents</text>
  <rect x="434" y="342" width="140" height="110" rx="4" class="pane"/>
  <text x="450" y="375" class="note">Pane %3</text>
  <rect x="448" y="399" width="112" height="34" rx="4" class="bot"/>
  <text x="504" y="423" class="profile">bot</text>
  <rect x="590" y="342" width="140" height="110" rx="4" class="pane"/>
  <text x="606" y="375" class="note">Pane %4</text>
  <rect x="604" y="399" width="112" height="34" rx="4" class="work"/>
  <text x="660" y="423" class="profile">work</text>
  <rect x="54" y="522" width="20" height="20" rx="3" class="work" stroke="#aebfae"/>
  <text x="88" y="539" class="note">work: shared logins</text>
  <rect x="418" y="522" width="20" height="20" rx="3" class="bot" stroke="#c9a38a"/>
  <text x="452" y="539" class="note">bot: separate logins</text>
</svg>
