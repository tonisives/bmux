schema_version: 1
id: bmux.x
name: X
category: Social Media
category: Social Media
version: 1.1.0
actions:
  - id: search
    group: Research
    title: Search X posts
    description: Search one latest query with paced reading. Observed posts use the configured social hook.
    command: [node, ./social.mjs, x, search]
    capabilities: [browser.read, browser.write, browser.cdp]
    timeout_seconds: 480
    parameters:
      - { name: query, title: Search query, kind: text, required: true }
      - { name: expected_account_url, title: Expected account URL, kind: text, required: true }
      - { name: result_limit, title: Result limit, kind: text, required: false }
  - id: browse
    group: Research
    title: Browse X URLs
    description: Pace a bounded list of X pages, with optional capped likes.
    command: [node, ./browse.mjs, x]
    capabilities: [browser.read, browser.write, browser.cdp]
    timeout_seconds: 3600
    parameters:
      - { name: urls, title: JSON array of X URLs, kind: text, required: true }
      - { name: topic, title: Topic phrase, kind: text, required: true }
  - id: follow
    group: Following
    title: Follow X profiles
    description: Follow up to 10 profiles per week.
    command: [node, ./follow.mjs, x]
    capabilities: [browser.read, browser.write, browser.cdp]
    timeout_seconds: 1800
    parameters:
      - { name: urls, title: JSON array of X profile URLs, kind: text, required: true }
