schema_version: 1
id: bmux.linkedin
name: LinkedIn
category: Social Media
version: 1.1.0
actions:
  - id: browse
    group: Research
    title: Browse LinkedIn URLs
    description: Pace a bounded list of LinkedIn pages, with optional capped likes.
    command: [node, ./browse.mjs, linkedin]
    capabilities: [browser.read, browser.write, browser.cdp]
    timeout_seconds: 3600
    parameters:
      - { name: urls, title: JSON array of LinkedIn URLs, kind: text, required: true }
      - { name: topic, title: Topic phrase, kind: text, required: true }
  - id: follow
    group: Following
    title: Follow LinkedIn profiles
    description: Follow up to 10 profiles per week.
    command: [node, ./follow.mjs, linkedin]
    capabilities: [browser.read, browser.write, browser.cdp]
    timeout_seconds: 1800
    parameters:
      - { name: urls, title: JSON array of LinkedIn profile URLs, kind: text, required: true }
