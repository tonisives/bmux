<!doctype html><html lang="en"><meta charset="utf-8"><title>Release checklist</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eef2e9;color:#304a41;font:18px/1.6 system-ui,sans-serif}header{padding:18px 28px;border-bottom:1px solid #c8d3c3;display:flex;justify-content:space-between;font-size:15px}main{padding:25px 28px}h1{font-size:32px;line-height:1.2;margin:0 0 25px}label{display:block;margin-bottom:10px;font-size:16px}input{width:100%;background:#fbfaf6;border:1px solid #8b9f90;border-radius:5px;color:#304a41;padding:12px;font:17px system-ui}button{background:#304a41;border:0;border-radius:5px;color:#fbfaf6;padding:12px 20px;margin:12px 0 23px;font:16px system-ui;cursor:pointer}ul{list-style:none;padding:0;margin:0}li{display:flex;align-items:center;gap:13px;padding:14px 0;border-top:1px solid #c8d3c3}li:before{content:'';width:17px;height:17px;border:1px solid #8b9f90;border-radius:3px;flex-shrink:0}#agent-result{padding:17px;background:#f4d7bd;border-radius:6px;margin-top:20px;font-size:16px}#agent-result b{display:block;font-weight:600;margin-bottom:3px}</style>
<header><span>Development / Tasks</span><span>Bot profile</span></header><main><h1>Release checklist</h1><form id="form"><label for="task">New task</label><input id="task" placeholder="Task name" autocomplete="off"><button id="add-task" type="submit">Add task</button></form><ul id="tasks"><li>Run the tests</li><li>Check the keyboard shortcuts</li></ul><div id="agent-result" hidden><b>Added through the bmux CLI</b><span id="result-text"></span></div></main><script>document.querySelector('#form').addEventListener('submit',event=>{event.preventDefault();let input=document.querySelector('#task');if(!input.value.trim())return;let item=document.createElement('li');item.textContent=input.value;document.querySelector('#tasks').append(item);document.querySelector('#result-text').textContent=input.value;document.querySelector('#agent-result').hidden=false;input.value='';});</script></html>
